<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>salle — component showcase</title>

    <!-- DaisyUI v5 (matches salle's DaisySkin class vocabulary: btn-soft, btn-dash,
         btn-xl, …). Its daisyui.css ships components + the light/dark themes but NO
         Tailwind preflight, so it styles the DaisyUI skin without resetting <button>/
         <input>. Imported into a `daisyui` layer ordered below `salle` purely as a
         safety boundary, so the native skin always wins if the two ever overlap. -->
    <style>
      @layer daisyui, salle;
      @import url("https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css") layer(daisyui);
    </style>

    <!-- salle's own look (the SalleSkin) — defines @layer salle, ordered after daisyui. -->
    <link rel="stylesheet" href="../salle/css/salle.css" />

    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f8fafc;
        color: #0f172a;
      }
      .demo-root {
        max-width: 920px;
        margin: 0 auto;
      }
      .demo-root > h1 {
        margin: 0 0 0.25rem;
      }
      .demo-root > p {
        margin: 0 0 1rem;
        color: #475569;
      }
      .demo-toolbar {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin: 0 0 2rem;
        padding: 0.75rem 1rem;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
      }
      .demo-skin-label {
        font-weight: 600;
      }
      .demo-section {
        margin-bottom: 1.75rem;
      }
      .demo-section > h2 {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
        margin: 0 0 0.6rem;
      }
      .demo-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
      }

      /* ImageCard showcase — a responsive wallpaper grid. */
      .demo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1rem;
      }
      .demo-res-badge {
        font-size: 0.7rem;
        font-weight: 600;
        padding: 0.15rem 0.45rem;
        border-radius: 0.375rem;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
      }
      .demo-card-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        width: 100%;
      }
      .demo-card-title {
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      .salle-theme-select {
        padding: 0.4rem 0.6rem;
        border-radius: 0.4rem;
        border: 1px solid #cbd5e1;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      /* Dark-mode chrome for the demo page itself. salle's components theme via their
         own tokens; these rules just keep the surrounding page coherent. */
      [data-theme="dark"] body {
        background: #0b1220;
        color: #e2e8f0;
      }
      [data-theme="dark"] .demo-root > p {
        color: #94a3b8;
      }
      [data-theme="dark"] .demo-toolbar {
        background: #1e293b;
        border-color: #334155;
      }
      [data-theme="dark"] .demo-section > h2 {
        color: #94a3b8;
      }
      [data-theme="dark"] .salle-theme-select {
        background: #1e293b;
        border-color: #475569;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="target/scala-3.8.3/salle-demo-fastopt/main.js"></script>
  </body>
</html>
